name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # PostgreSQL для тестов запускается рядом с job как сервис
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: tasks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d tasks_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -v

  # Сборка и публикация образа: только при push в main и только если lint и test прошли
  build:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # для публикации в GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/makschocomint/fastapi-tasks:latest
            ghcr.io/makschocomint/fastapi-tasks:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-tasks:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-tasks:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
