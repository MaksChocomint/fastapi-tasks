services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    # Порт на хосте можно сменить через DB_PORT, если 5432 уже занят
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
